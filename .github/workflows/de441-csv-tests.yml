# Modification record: 2026-11-12 — add deterministic offline Python CSV comparator CI.

name: DE441 CSV comparator tests

on:
  pull_request:
    paths:
      - 'tools/compare_de441_vectors.py'
      - 'tools/test_compare_de441_vectors.py'
      - '.github/workflows/de441-csv-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-csv:
    name: Python CSV comparator regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run offline Python standard-library regressions
        run: python3 -m unittest discover -s tools -p 'test_compare_de441_vectors.py' -v
