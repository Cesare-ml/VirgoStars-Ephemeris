# One-time owner-authorized upload; remove this workflow after completion.
name: DE441 one-time draft upload
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'Cesare-ml/VirgoStars-Ephemeris'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4eaa6ecef388e9f575f8fa0f12975187b4a0dc5f
          persist-credentials: false
      - name: Download and authenticate the NASA JPL source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/de441.eph" 'https://ssd.jpl.nasa.gov/ftp/eph/planets/Linux/de441/linux_m13000p17000.441'
          echo '476096486def4e41bfceb29aa27f50784da0bce318902bcf7b88caad058cd4da  '"$RUNNER_TEMP/de441.eph" | sha256sum --check
      - name: Build and verify the 145 slices
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          python3 scripts/build_de441_contiguous_packs.py build --source "$RUNNER_TEMP/de441.eph" --output-dir "$RUNNER_TEMP/de441" --packs all --expected-source-sha256 476096486def4e41bfceb29aa27f50784da0bce318902bcf7b88caad058cd4da
          python3 scripts/build_de441_contiguous_packs.py release-catalog --manifest "$RUNNER_TEMP/de441/de441-contiguous-manifest-v2.json" --output-dir "$RUNNER_TEMP/catalog" --release-tag de441-desktop-v1.0.0 --reuse-mobile-v1
          echo 'ad80ef75b5f3984947a6dc04d4de184c35701600ca587aff155d7228fd03667b  '"$RUNNER_TEMP/catalog/de441-release-catalog-v1.json" | sha256sum --check
      - name: Upload missing files to the existing draft and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: Cesare-ml/VirgoStars-Ephemeris
          RELEASE_ID: '451750859'
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$REPO/releases/$RELEASE_ID"
          gh api "$api" --jq 'select(.draft == true and .tag_name == "de441-desktop-v1.0.0") | .id' | grep -Fx "$RELEASE_ID"
          gh api --paginate --slurp "$api/assets?per_page=100" | jq 'add // []' > "$RUNNER_TEMP/assets.json"
          while IFS=$'\t' read -r name size digest; do
            existing=$(jq -c --arg n "$name" '[.[] | select(.name == $n)]' "$RUNNER_TEMP/assets.json")
            count=$(jq 'length' <<< "$existing")
            if [ "$count" -gt 0 ]; then
              [ "$count" -eq 1 ] && jq -e --arg d "sha256:$digest" --argjson s "$size" '.[0] | .state == "uploaded" and .digest == $d and .size == $s' <<< "$existing" >/dev/null || { echo "Existing asset is incomplete or mismatched: $name" >&2; exit 1; }
              continue
            fi
            curl --fail-with-body --silent --show-error --retry 3 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/octet-stream' --data-binary @"$RUNNER_TEMP/de441/$name" "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" > "$RUNNER_TEMP/result.json"
            jq -e --arg d "sha256:$digest" --arg n "$name" --argjson s "$size" '.state == "uploaded" and .digest == $d and .name == $n and .size == $s' "$RUNNER_TEMP/result.json" >/dev/null
            echo "Verified $name"
          done < <(jq -r '.packs[] | select(.releaseTag == null) | [.filename, .bytes, .sha256] | @tsv' "$RUNNER_TEMP/catalog/de441-release-catalog-v1.json")
          name='de441-release-catalog-v1.json'
          digest='ad80ef75b5f3984947a6dc04d4de184c35701600ca587aff155d7228fd03667b'
          existing=$(jq -c --arg n "$name" '[.[] | select(.name == $n)]' "$RUNNER_TEMP/assets.json")
          if [ "$(jq 'length' <<< "$existing")" -eq 0 ]; then
            curl --fail-with-body --silent --show-error --retry 3 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/catalog/$name" "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" > "$RUNNER_TEMP/result.json"
            jq -e --arg d "sha256:$digest" --arg n "$name" '.state == "uploaded" and .digest == $d and .name == $n' "$RUNNER_TEMP/result.json" >/dev/null
          else
            jq -e --arg d "sha256:$digest" 'length == 1 and (.[0] | .state == "uploaded" and .digest == $d)' <<< "$existing" >/dev/null
          fi
          echo 'All requested data files staged. This workflow does not publish the release.'
