name: Rust development CI

on:
  pull_request:
    branches: [dev/ephemeris]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/audit_iana_leap_seconds.py'
      - 'scripts/test_audit_iana_leap_seconds.py'
      - '.github/workflows/rust-dev.yml'
  push:
    branches: [dev/ephemeris]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/audit_iana_leap_seconds.py'
      - 'scripts/test_audit_iana_leap_seconds.py'
      - '.github/workflows/rust-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt, test and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check offline IANA leap-file maintenance tests
        run: python3 -m unittest discover -s scripts -p 'test_audit_iana_leap_seconds.py' -v
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run deterministic workspace tests
        run: cargo test --workspace --locked
      - name: Check offline Horizons reference parser
        run: cargo test --workspace --example validate_horizons --locked
      - name: Run optimized workspace regression tests
        run: cargo test --workspace --release --locked
      - name: Check Clippy warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check public Rust API documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: '-D warnings'
      - name: Install Windows GNU compilation target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Check Windows GNU cross-target compilation
        run: cargo check --workspace --locked --target x86_64-pc-windows-gnu

  windows-native:
    name: Windows native Rust tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run workspace tests natively on Windows
        run: cargo test --workspace --locked
      - name: Run Horizons comparator regressions on Windows
        run: cargo test --workspace --example validate_horizons --locked
      - name: Run Clippy natively on Windows
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  macos-native:
    name: macOS native Rust tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run workspace tests natively on macOS
        run: cargo test --workspace --locked
      - name: Run Horizons comparator regressions on macOS
        run: cargo test --workspace --example validate_horizons --locked
      - name: Run Clippy natively on macOS
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
